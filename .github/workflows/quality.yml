name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check Python syntax
        run: python -m compileall -q app.py studio_core.py tests
      - name: Run GPU-free unit tests
        run: python -m unittest discover -s tests -v
